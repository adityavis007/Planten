name: planten
description: "AI-Powered Crop Disease Diagnosis App for Farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.8.1

  # Firebase Cloud Services (Spark Free Tier)
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.2

  # On-Device AI Inference
  flutter_litert: ^3.8.0

  # Camera & Image Utilities
  camera: ^0.12.1
  image_picker: ^1.1.2
  image: ^4.5.4

  # Local Persistence & Offline Sync
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  path_provider: ^2.1.5

  # Theming, UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  url_launcher: ^6.3.1
  http: ^1.6.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Assets configuration
  assets:
    - assets/model/
    - assets/knowledge_base/
    - assets/icons/crops/
    - assets/images/
